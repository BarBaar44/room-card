# Example with made-up entity ids. Every role defaults to null (not shown);
# `type: custom:room-card` alone renders the house with neutral names.
type: custom:room-card
grid_options:
  columns: 12
  rows: 7
name: Home
humidity_alert: 70
dark_below: 10
entities:
  dark: sensor.outdoor_illuminance # or a binary_sensor (on = dark); null: the sun
  sun: sun.sun
  lantern: light.garden_lantern
  kitchen_light: light.kitchen
  front_door: binary_sensor.front_door
  garden_door: binary_sensor.garden_doors
  kitchen_door: binary_sensor.kitchen_door
rooms:
  attic_left: # attic, left: bed under the dakkapel, bed light
    name: Attic bedroom
    short_name: Attic
    temperature: sensor.attic_bedroom_temperature
    humidity: sensor.attic_bedroom_humidity
    light: switch.attic_bedroom_light
    climate: climate.attic_bedroom
    bed_light: switch.attic_bedroom_bed_light
  attic_right: # attic, right: bike
    name: Gym
    temperature: sensor.gym_temperature
  first_1: # first floor, left: bed, bed light
    name: Bedroom 1
    temperature: sensor.bedroom_1_temperature
    humidity: sensor.bedroom_1_humidity
    light: switch.bedroom_1_light
    climate: climate.bedroom_1
    bed_light: switch.bedroom_1_bed_light
  first_2: # first floor, second: desk
    name: Office
    temperature: sensor.office_temperature
    light: switch.office_light
  first_3: # first floor, third: king bed, ceiling fan
    name: Main bedroom
    short_name: Bedroom
    temperature: sensor.main_bedroom_temperature
    humidity: sensor.main_bedroom_humidity
    light: light.main_bedroom
    climate: climate.main_bedroom
    fan: fan.main_bedroom
    door: binary_sensor.main_bedroom_door
  first_4: # first floor, right: shower, ceiling extractor
    name: Bathroom
    short_name: Bath
    temperature: sensor.bathroom_temperature
    humidity: sensor.bathroom_humidity
    light: light.bathroom
    fan: switch.bathroom_fan
    shower: binary_sensor.shower
  ground_left: # ground floor, left: hallway with the stairs
    name: Hallway
    short_name: Hall
    temperature: sensor.hallway_temperature
    light: switch.hallway_light
    climate: climate.hallway
    occupancy: binary_sensor.hallway_motion
  ground_right: # ground floor, right: living room, radiator, open kitchen
    name: Living room
    short_name: Living
    temperature: sensor.living_room_temperature
    humidity: sensor.living_room_humidity
    light: light.living_room
    climate: climate.living_room
    window: binary_sensor.window_living_room
